# EMERGENCY CONFIG - MINIMAL JEKYLL BUILD
title: "Jan Sáška - Elite MTB Racer"
url: "https://tercasaskova311.github.io"
baseurl: "/jansaska"
repository: "tercasaskova311/jansaska"

# Author
author:
  name: "Jan Sáška"
  bio: "Elite MTB XCO Rider • National Champion • World Cup Competitor"
  avatar: "/images/DSC05016.jpeg"
  location: "Stachy, Czechia"
  email: "saskahonza@gmail.com"

# Theme - DISABLE remote theme for now
# remote_theme: "mmistakes/minimal-mistakes@4.24.0"
theme: minima

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: Europe/Prague

# ESSENTIAL plugins only
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  racing:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default

# AGGRESSIVE exclusions to prevent theme processing
exclude:
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules
  - Dockerfile
  - docker-compose.yaml
  - Gemfile*
  - package*.json
  - README.md
  - replit.md
  - "**/*docs*/**"
  - "**/*test*/**"
  - "**/*spec*/**"
  - "**/minimal-mistakes*/**"
  - "**/jekyll-remote-theme*/**"
  - "assets/css/main.scss"
  - "assets/css/*.scss"

# Include
include:
  - _pages

# Kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge